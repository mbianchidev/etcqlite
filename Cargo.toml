[package]
name = "etcqlite"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "SQLite-backed etcd-compatible storage with non-Raft consensus"
publish = false
license = "MIT"

[dependencies]
base64 = "=0.23.1"
bcrypt = "=0.19.3"
axum = "=0.8.9"
clap = { version = "=4.6.7", features = ["derive", "env"] }
crc32c = "=0.6.9"
flate2 = "=1.1.11"
omnipaxos = { path = "vendor/omnipaxos", default-features = false, features = ["serde"] }
pbjson = "=0.9.0"
prost = "=0.14.4"
prost-types = "=0.14.4"
regex = "=1.13.1"
rusqlite = { version = "=0.41.1", features = ["bundled", "backup"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
thiserror = "=2.0.21"
tempfile = "=3.27.0"
time = { version = "=0.3.55", features = ["formatting", "parsing"] }
tonic = { version = "=0.14.9", features = ["tls-ring", "gzip"] }
tonic-prost = "=0.14.9"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs", "io-util", "process"] }
tokio-stream = { version = "=0.1.19", features = ["net"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
uuid = { version = "=1.29.1", features = ["v4", "serde"] }
x509-parser = "=0.18.1"

[build-dependencies]
pbjson-build = "=0.9.0"
tonic-prost-build = "=0.14.9"

[dev-dependencies]
time = { version = "=0.3.55", features = ["macros"] }
omnipaxos_storage = { git = "https://github.com/haraldng/omnipaxos", rev = "9c772dcce5a9652192f45f67d9d2208b306f3bc9", default-features = false }

[patch."https://github.com/haraldng/omnipaxos"]
omnipaxos = { path = "vendor/omnipaxos" }

[profile.release]
lto = "thin"
codegen-units = 1
